<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Invoice</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div class="page"><div th:replace="~{fragments :: navbar}"></div>
<p class="eyebrow">Order to Cash</p><h1 class="page-heading">Create Customer Invoice</h1><p class="subtitle">Create a receivable for thermal energy delivered to a greenhouse grower.</p>
<div class="form-card"><form action="/customer-invoices/save" method="post"><div class="form-grid">
<div class="field"><label>Sales Order</label><select name="salesOrderId" required><option value="">Select sales order</option><option th:each="x:${salesOrders}" th:value="${x.id}" th:text="${x.id + ' - ' + x.energyKwh + ' kWh - ₹' + x.totalAmount}"></option></select></div>
<div class="field"><label>Grower ID</label><input type="number" name="growerId" required placeholder="1"></div>
<div class="field"><label>Energy (kWh)</label><input type="number" step="0.01" name="energyKwh" required></div>
<div class="field"><label>Invoice Amount (₹)</label><input type="number" step="0.01" name="amount" required></div>
</div><div class="form-actions"><button class="btn btn-primary" type="submit">Create Invoice</button><a class="btn btn-light" href="/customer-invoices">Cancel</a></div></form></div></div></body></html>
