<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendor Bill</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div class="page"><div th:replace="~{fragments :: navbar}"></div>
<p class="eyebrow">Procure to Pay</p><h1 class="page-heading">Create Vendor Bill</h1><p class="subtitle">Record the supplier liability generated by a pump or maintenance purchase.</p>
<div class="form-card"><form action="/vendor-bills/save" method="post"><div class="form-grid">
<div class="field"><label>Purchase Order</label><select name="purchaseOrderId" required><option value="">Select PO</option><option th:each="x:${purchaseOrders}" th:value="${x.id}" th:text="${x.id + ' - ₹' + x.totalAmount}"></option></select></div>
<div class="field"><label>Vendor ID</label><input type="number" name="vendorId" required placeholder="2"></div>
<div class="field"><label>Bill Amount (₹)</label><input type="number" step="0.01" name="amount" required placeholder="18000"></div>
</div><div class="form-actions"><button class="btn btn-primary" type="submit">Create Vendor Bill</button><a class="btn btn-light" href="/vendor-bills">Cancel</a></div></form></div></div></body></html>
