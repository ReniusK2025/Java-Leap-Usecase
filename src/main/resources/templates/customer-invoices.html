<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Invoices</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div class="page"><div th:replace="~{fragments :: navbar}"></div>
<div class="toolbar"><div><p class="eyebrow">Order to Cash</p><h1 class="page-heading">Customer Invoices</h1><p class="subtitle">Invoice greenhouse growers for thermal heating delivered.</p></div><a class="btn btn-primary" href="/customer-invoices/new">＋ New Invoice</a></div>
<div class="card"><div class="table-wrap"><table><thead><tr><th>ID</th><th>Sales Order</th><th>Grower</th><th>Energy kWh</th><th>Amount</th><th>Date</th><th>Status</th></tr></thead><tbody>
<tr th:each="x:${invoices}"><td th:text="${x.id}"></td><td th:text="${x.salesOrderId}"></td><td th:text="${x.growerId}"></td><td th:text="${x.energyKwh}"></td><td class="price" th:text="'₹' + ${x.amount}"></td><td th:text="${x.invoiceDate}"></td><td><span class="badge" th:classappend="${x.status == 'PAID' ? ' badge-yes' : ' badge-warn'}" th:text="${x.status}"></span></td></tr>
<tr th:if="${#lists.isEmpty(invoices)}"><td colspan="7" class="empty">No customer invoices yet.</td></tr></tbody></table></div></div></div></body></html>
