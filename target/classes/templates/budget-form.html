<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${pageTitle}">Budget</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div class="page"><div th:replace="~{fragments :: navbar}"></div>
<p class="eyebrow">Planning</p><h1 class="page-heading" th:text="${pageTitle}">Budget</h1><p class="subtitle">Set the seasonal budget for a greenhouse thermal storage zone.</p>
<div class="form-card"><form th:action="${budget.id == null ? '/budgets/save' : '/budgets/update/' + budget.id}" method="post"><div class="form-grid">
<div class="field"><label>Greenhouse Zone</label><input name="zone" th:value="${budget.zone}" required placeholder="Thermal Storage Zone 3"></div>
<div class="field"><label>Season</label><input name="season" th:value="${budget.season}" required placeholder="2026-2027"></div>
<div class="field"><label>Heating Revenue Budget (₹)</label><input type="number" step="0.01" name="heatingRevenueBudget" th:value="${budget.heatingRevenueBudget}" required></div>
<div class="field"><label>Pump Power Budget (₹)</label><input type="number" step="0.01" name="pumpPowerExpenseBudget" th:value="${budget.pumpPowerExpenseBudget}" required></div>
<div class="field"><label>Servicing Budget (₹)</label><input type="number" step="0.01" name="servicingExpenseBudget" th:value="${budget.servicingExpenseBudget}" required></div>
</div><div class="form-actions"><button class="btn btn-primary" type="submit">Save Budget</button><a class="btn btn-light" href="/budgets">Cancel</a></div></form></div></div></body></html>
